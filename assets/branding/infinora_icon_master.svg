<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle / Canvas -->
    <rect id="bg" width="1024" height="1024" rx="225" fill="#070B14"/>
    
    <!-- Linear Gradients for Stylus and Paint Ribbon -->
    <linearGradient id="paintRibbonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="paintRibbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="paintRibbonCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="stylusBarrel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="stylusChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="stylusCone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="75%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Studio Canvas Background -->
  <rect width="1024" height="1024" fill="#070B14"/>

  <!-- Subtle Studio Drafting Grid -->
  <g stroke="#38BDF8" stroke-width="2" opacity="0.10">
    <line x1="160" y1="100" x2="160" y2="924"/>
    <line x1="336" y1="100" x2="336" y2="924"/>
    <line x1="512" y1="100" x2="512" y2="924"/>
    <line x1="688" y1="100" x2="688" y2="924"/>
    <line x1="864" y1="100" x2="864" y2="924"/>

    <line x1="100" y1="160" x2="924" y2="160"/>
    <line x1="100" y1="336" x2="924" y2="336"/>
    <line x1="100" y1="512" x2="924" y2="512"/>
    <line x1="100" y1="688" x2="924" y2="688"/>
    <line x1="100" y1="864" x2="924" y2="864"/>
  </g>

  <!-- INFINITE ZOOM PERSPECTIVE CANVASES (Receding Layers) -->
  <!-- Vanishing Perspective Horizon Rays -->
  <g stroke="#38BDF8" stroke-width="3" opacity="0.4" stroke-dasharray="6 4">
    <line x1="170" y1="270" x2="485" y2="450"/>
    <line x1="854" y1="180" x2="575" y2="435"/>
    <line x1="790" y1="800" x2="560" y2="525"/>
    <line x1="130" y1="720" x2="475" y2="515"/>
  </g>

  <!-- Level 1: Outer Workspace Sheet -->
  <polygon points="170,270 854,180 790,800 130,720" fill="#0F172A" fill-opacity="0.25" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Level 2: Mid Canvas Layer (Zoom 200%) -->
  <polygon points="290,340 760,280 710,710 260,660" fill="#0284C7" fill-opacity="0.15" stroke="#0369A1" stroke-width="6" stroke-linejoin="round"/>

  <!-- Level 3: Precision Drawing Layer (Zoom 800%) -->
  <polygon points="400,400 670,360 635,625 380,590" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="8" stroke-linejoin="round"/>

  <!-- Level 4: Infinite Origin Aperture -->
  <polygon points="485,450 575,435 560,525 475,515" fill="#38BDF8" fill-opacity="0.40" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>

  <!-- FLUID CREATIVE ART PAINT RIBBON (Painting & Color) -->
  <!-- Cyan & Cobalt Wave -->
  <path d="M 512 485 C 620 480 780 530 835 625 C 885 710 860 800 785 845 C 710 890 580 860 495 800"
        fill="none" stroke="url(#paintRibbonCyan)" stroke-width="58" stroke-linecap="round"/>

  <!-- Warm Sunset Gold Streak -->
  <path d="M 512 485 C 610 495 750 555 800 660 C 835 735 815 810 750 845 C 695 875 600 855 530 805"
        fill="none" stroke="url(#paintRibbonGold)" stroke-width="26" stroke-linecap="round"/>

  <!-- Vibrant Coral Highlight Streak -->
  <path d="M 512 485 C 595 505 720 570 765 680 C 795 750 775 815 720 840"
        fill="none" stroke="url(#paintRibbonCoral)" stroke-width="10" stroke-linecap="round"/>

  <!-- White Glint Line -->
  <path d="M 512 485 C 600 485 730 535 800 630"
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- PRECISION DIGITAL STYLUS (Drawing & Design) -->
  <g transform="translate(512, 485) rotate(-43)">
    <!-- Barrel -->
    <rect x="-32" y="100" width="64" height="420" fill="url(#stylusBarrel)"/>
    <!-- Chrome Accent Rings -->
    <rect x="-32" y="100" width="64" height="16" fill="url(#stylusChrome)"/>
    <rect x="-32" y="144" width="64" height="10" fill="url(#stylusChrome)"/>
    <!-- Glowing Cyan Status LED -->
    <rect x="-32" y="116" width="64" height="8" fill="#38BDF8"/>
    <!-- Front Nose Cone -->
    <polygon points="-32,100 32,100 9,22 -9,22" fill="url(#stylusCone)"/>
    <!-- Tungsten Tip -->
    <polygon points="-9,22 9,22 0,0" fill="#FFFFFF"/>
  </g>

  <!-- VECTOR ORIGIN SPARK & FOCUS FLARE -->
  <circle cx="512" cy="485" r="44" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.3"/>
  <circle cx="512" cy="485" r="28" fill="none" stroke="#38BDF8" stroke-width="5" opacity="0.6"/>
  <circle cx="512" cy="485" r="16" fill="#0284C7"/>
  <circle cx="512" cy="485" r="8.5" fill="#FFFFFF"/>

  <!-- Crosshair Precision Spark -->
  <line x1="480" y1="485" x2="544" y2="485" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="512" y1="453" x2="512" y2="517" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="494" y1="467" x2="530" y2="503" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="494" y1="503" x2="530" y2="467" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
