<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle -->
    <rect id="bg" width="1024" height="1024" rx="225" fill="#0B0F19"/>
    
    <!-- Subtle Coordinate Grid Guide -->
    <circle id="ring1" cx="512" cy="512" r="390" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.4"/>
    <circle id="ring2" cx="512" cy="512" r="470" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.25"/>
  </defs>

  <!-- Master Dark Canvas Background -->
  <rect width="1024" height="1024" fill="#0B0F19"/>
  <rect x="40" y="40" width="944" height="944" rx="190" fill="none" stroke="#1E293B" stroke-width="6" opacity="0.35"/>
  <circle cx="512" cy="512" r="390" fill="none" stroke="#1E293B" stroke-width="4" opacity="0.4"/>
  <circle cx="512" cy="512" r="470" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.25"/>

  <!-- PERSPECTIVE CANVAS FRAME (Isometric Infinite Canvas Plane) -->
  <g id="perspective-canvas-frame">
    <!-- Outer 3D Extrusion Shadow -->
    <polygon points="380,240 780,220 644,784 244,804" fill="none" stroke="#060911" stroke-width="40" stroke-linejoin="round" opacity="0.6"/>
    <!-- Extruded Depth Bevel in Dark Cobalt -->
    <polygon points="384,244 784,224 648,788 248,808" fill="none" stroke="#1D4ED8" stroke-width="28" stroke-linejoin="round"/>
    <!-- Front Bevel in Sky Cyan -->
    <polygon points="380,240 780,220 644,784 244,804" fill="none" stroke="#38BDF8" stroke-width="24" stroke-linejoin="round"/>
    <!-- Interior Perspective Highlight in Crisp White -->
    <polygon points="380,240 780,220 644,784 244,804" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- INFINORA BRAND SYMBOL: PRECISION 3D GEOMETRIC INFINITY LOOP -->
  <g id="infinora-infinity-loop">
    <!-- Underpass Ambient Shadow -->
    <path d="M 512 512 C 420 640 310 670 230 600 C 150 530 160 410 240 370 C 330 320 430 380 512 512 C 594 644 694 704 784 654 C 864 614 874 494 794 424 C 714 354 604 384 512 512 Z"
          fill="none" stroke="#050811" stroke-width="76" stroke-linecap="round" opacity="0.55"/>

    <!-- Left Lobe Main Extrusion: Deep Cobalt Blue (#1D4ED8) -->
    <path d="M 512 512 C 420 640 310 670 230 600 C 150 530 160 410 240 370 C 330 320 430 380 512 512"
          fill="none" stroke="#1D4ED8" stroke-width="68" stroke-linecap="round"/>

    <!-- Left Lobe Front Facet: Electric Cobalt Blue (#2563EB) -->
    <path d="M 512 512 C 420 640 310 670 230 600 C 150 530 160 410 240 370 C 330 320 430 380 512 512"
          fill="none" stroke="#2563EB" stroke-width="52" stroke-linecap="round"/>

    <!-- Left Lobe Top Edge Highlight: Sky Cyan (#38BDF8) -->
    <path d="M 500 500 C 414 624 314 652 240 586 C 168 522 176 418 248 382 C 330 338 422 392 500 518"
          fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.95"/>

    <!-- Right Lobe Main Extrusion: Deep Cobalt Blue (#1D4ED8) -->
    <path d="M 512 512 C 594 644 694 704 784 654 C 864 614 874 494 794 424 C 714 354 604 384 512 512"
          fill="none" stroke="#1D4ED8" stroke-width="68" stroke-linecap="round"/>

    <!-- Right Lobe Front Facet: Sky Cyan (#38BDF8) -->
    <path d="M 512 512 C 594 644 694 704 784 654 C 864 614 874 494 794 424 C 714 354 604 384 512 512"
          fill="none" stroke="#38BDF8" stroke-width="52" stroke-linecap="round"/>

    <!-- Right Lobe Top Edge Highlight: Crisp White (#FFFFFF) -->
    <path d="M 512 512 C 594 644 694 704 784 654 C 864 614 874 494 794 424 C 714 354 604 384 512 512"
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

    <!-- 3D Interlocking Overpass Ribbon (Crossing Horizon) -->
    <path d="M 440 420 C 476 466 548 558 584 604"
          fill="none" stroke="#050811" stroke-width="72" stroke-linecap="round" opacity="0.5"/>
    <path d="M 440 420 C 476 466 548 558 584 604"
          fill="none" stroke="#2563EB" stroke-width="56" stroke-linecap="round"/>
    <path d="M 440 420 C 476 466 548 558 584 604"
          fill="none" stroke="#38BDF8" stroke-width="16" stroke-linecap="round"/>
    <path d="M 440 420 C 476 466 548 558 584 604"
          fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

    <!-- Center Infinite Canvas Origin Node (Focal Anchor) -->
    <circle cx="512" cy="512" r="14" fill="#1D4ED8" opacity="0.8"/>
    <circle cx="512" cy="512" r="8" fill="#38BDF8"/>
    <circle cx="512" cy="512" r="4" fill="#FFFFFF"/>
  </g>
</svg>
