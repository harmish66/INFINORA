<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient / Fill -->
    <rect id="bg" width="1024" height="1024" fill="#21145B"/>
    
    <!-- Impasto Drop Shadow -->
    <filter id="brushShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0B0620" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Indigo Canvas Background (#21145B) -->
  <rect width="1024" height="1024" fill="#21145B"/>

  <!-- Subtle Underlying Canvas Surface -->
  <rect x="232" y="232" width="560" height="560" rx="56" fill="#2B1A73" opacity="0.6"/>
  <rect x="232" y="232" width="560" height="560" rx="56" fill="none" stroke="#6558F5" stroke-width="6" opacity="0.25"/>
  <circle cx="512" cy="512" r="240" fill="none" stroke="#9A79F8" stroke-width="3" opacity="0.12"/>
  <circle cx="512" cy="512" r="180" fill="none" stroke="#9A79F8" stroke-width="3" opacity="0.10"/>

  <!-- FLOWING ARTISTIC PAINT STROKE -->
  <g id="paint-stroke" filter="url(#brushShadow)">
    <!-- Base Flow: Sky Blue (#38BDF8) -->
    <path d="M 302 672 C 342 752 472 762 552 692 C 632 622 652 512 582 442 C 522 382 432 422 402 492 C 377 552 412 612 462 632"
          fill="none" stroke="#38BDF8" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mid Flow: Electric Purple (#9A79F8) -->
    <path d="M 312 642 C 362 722 482 732 557 667 C 632 602 647 502 577 432 C 522 372 442 412 412 477 C 387 537 422 597 472 617"
          fill="none" stroke="#9A79F8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Core Flow: Artistic Pink (#F05BCB) -->
    <path d="M 327 612 C 382 687 492 697 562 637 C 627 577 637 492 572 427 C 522 367 452 402 427 462 C 407 517 437 577 482 597"
          fill="none" stroke="#F05BCB" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Warm Highlight Flow: Warm Orange (#FFAD57) -->
    <path d="M 342 587 C 402 657 502 662 562 607 C 617 557 622 482 567 422"
          fill="none" stroke="#FFAD57" stroke-width="14" stroke-linecap="round"/>

    <!-- Impasto Specular Highlights (#FFFFFF) -->
    <path d="M 362 592 C 417 647 507 652 557 602"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M 577 572 C 607 532 607 482 562 437"
          fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- PROFESSIONAL ARTIST PAINTBRUSH -->
  <g id="paintbrush" filter="url(#brushShadow)">
    <!-- Polished Handle -->
    <path d="M 677 322 L 762 237 L 787 262 L 702 347 Z" fill="#160E3D"/>
    <line x1="680" y1="325" x2="765" y2="240" stroke="#6558F5" stroke-width="4" opacity="0.6"/>

    <!-- Polished Silver Ferrule -->
    <path d="M 642 357 L 682 317 L 707 342 L 667 382 Z" fill="#CBD5E1"/>
    <!-- Crimp lines -->
    <line x1="654" y1="369" x2="694" y2="329" stroke="#64748B" stroke-width="3"/>
    <line x1="660" y1="375" x2="700" y2="335" stroke="#64748B" stroke-width="3"/>
    <line x1="645" y1="360" x2="685" y2="320" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- Sable Bristles -->
    <path d="M 642 357 L 667 382 C 637 412 607 432 562 427 C 587 397 617 377 642 357 Z" fill="#331B68"/>

    <!-- Wet Loaded Tip (Artistic Pink & Orange) -->
    <path d="M 617 397 L 637 417 C 617 432 592 437 562 427 C 580 412 600 402 617 397 Z" fill="#F05BCB"/>
    <circle cx="574" cy="425" r="7" fill="#FFAD57"/>
    <circle cx="568" cy="426" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Dynamic Artistic Paint Droplets -->
  <circle cx="607" cy="382" r="5.5" fill="#F05BCB"/>
  <circle cx="627" cy="367" r="3.5" fill="#FFFFFF"/>
  <circle cx="382" cy="462" r="4.5" fill="#38BDF8"/>
  <circle cx="347" cy="707" r="6" fill="#FFAD57"/>
  <circle cx="582" cy="722" r="5" fill="#F05BCB"/>
</svg>
